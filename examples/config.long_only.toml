# Offline long-only portfolio example. Runs from the built wheel with no
# network access:
#   historical-asset-risk --config examples/config.long_only.toml
# Relative paths below resolve against this file's folder, so the command works
# from any directory.
[analysis]
provider = "csv"
csv_path = "data/adjusted_prices.csv"
tickers = ["SPY", "QQQ"]
start_date = "2024-01-01"
end_date = "2024-02-01"
rolling_window = 3
observations_per_year = 252

output_dir = "../outputs/example-long-only"

instrument_registry_path = "data/instrument_registry.csv"
positions_path = "data/positions_long_only.csv"
cash_path = "data/cash_long_only.csv"

tail_risk_confidence_level = 0.95
stress_catalog_path = "stress_catalog.example.json"
